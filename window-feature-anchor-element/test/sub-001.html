<!doctype html>
<title>sub-001</title>
<script>
        function moveWindow() {
            window.moveBy(10, 10);
        }

        function openSameURL() {
            window.open("./sub-001.html", "_blank", "width=200,height=200");
        }
        function getWindowPosition() {
            const windowInfo = `left: ${window.screenX}, top: ${window.screenY}, width: ${window.outerWidth}, height: ${window.outerHeight}`;
            document.getElementById("target").innerText = windowInfo;
        }
        function anchorAlignDefault() {
            let selectorValue = "#anchor-align-default";
            const ownedWindow = window.open("./sub-001.html", "_blank", `sticky, width=200,height=200,anchorelement=${selectorValue}`);
        }

</script>
<body onload="setTimeout(() => {
    window.close();
}, 5000);">
    <a href="./sub_002.html">new location</a> This is the sub window, stick to the left of window's opener.
    <a href="https://cn.bing.com/">other origin </a>
    <input type="button" value="move window" onclick="moveWindow()"><br>
    <input type="button" value="open window" onclick="openSameURL()">
    <input type="button" value="window rect" onclick="getWindowPosition()"><br>
    <input class="anchor-align" type="button" value="open window with anchorelement + sticky" id="anchor-align-default" onclick="anchorAlignDefault()"> <br>
    <div id="target"></div>
</body>
